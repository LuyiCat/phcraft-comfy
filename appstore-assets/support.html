  <style>body{max-width:760px;margin:40px auto;padding:0 20px;font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#222}h1{line-height:1.3}h2{margin-top:2em}</style>

<body>
  <h1>PhotoComfy 技术支持</h1>
  <p>PhotoComfy 是一款纯本地运行的 iPad 图像编辑器。应用不需要注册账号或连接服务器。</p>
  <h2>常见操作</h2>
  <ol>
    <li>打开应用并选择“新建文档”。</li>
    <li>使用图层、画笔、选区、调整和文字工具编辑图片。</li>
    <li>通过“文件”菜单导入或导出 PSD、PNG、JPEG、TIFF 等文件。</li>
    <li>工程文件保存在 iPad 本地，可通过系统文件应用管理。</li>
  </ol>
  <h2>联系我们</h2>
  <p>如需报告问题，请在 App Store 页面提供的支持邮箱中附上：iPadOS 版本、PhotoComfy 版本、问题复现步骤，以及不包含个人信息的错误截图。</p>
</body>
</html>
