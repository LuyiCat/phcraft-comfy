name: Release

# Tag-driven releases (agent.md › 基于 tag 的发布流程): pushing an annotated `vX.Y` tag
# builds every platform and assembles one draft GitHub Release with a SHA256SUMS.txt over all
# assets; the Android APK rides the same `release-*` artifact pattern as the desktop builds.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 0.2.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Regenerates contributors/contributors.json for the release commit; every build bundles it.
  credits:
    permissions:
      contents: read
      pull-requests: read
    uses: storytold/craft-common-actions/.github/workflows/refresh-contributors.yml@main
  release:
    needs: credits
    # Intentionally tracked at @main (not SHA-pinned) so org-wide CI improvements, security fixes, and build optimizations propagate without PR churn across all craftapp repos.
    uses: storytold/craft-common-actions/.github/workflows/release.yml@main
    with:
      app-name: photocraft
      app-title: PhotoCraft
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      version: ${{ inputs.version }}
      contributors-artifact: ${{ needs.credits.outputs.artifact-name }}
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
      LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}

  # Cross-compiles, signs and verifies the PhotoComfy APK (agent.md › Android 发布要求):
  # the fixed release keystore comes from secrets, the signature and metadata are checked, and
  # the artifact joins the `release-*` set the desktop release job attaches to the draft
  # release — SHA256SUMS.txt therefore covers the APK too.
  android:
    needs: credits
    timeout-minutes: 120
    name: android (arm64 apk)
    runs-on: ubuntu-latest
    env:
      # Same pinned central fonts as the desktop and CI builds, so CJK and other non-Latin
      # interface text ships with real glyphs (crates/text/build.rs).
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The artifact holds contributors/contributors.json; downloading at the repo root
      # restores the path every source build bundles.
      - name: Install the contributor snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.credits.outputs.artifact-name }}
          path: .

      - name: Check out craft-fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts
          persist-credentials: false

      # The PhotoComfy Chinese font pack (docs/photocomfy-fonts.md): downloaded and checked against
      # its lock, like the fonts above, and embedded by apps/photocraft-android/android/build.sh.
      - name: Fetch the PhotoComfy font pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/photocomfy-fonts.sh

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-android
          cache-on-failure: true

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-ndk

      # Manual test runs only: the desktop jobs rewrite the workspace the same way; tag pushes
      # read the version the release commit already set.
      - name: Apply version override
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: cargo xtask version set "$VERSION"

      - name: Resolve the version
        id: version
        run: |
          VERSION="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          # Cargo writes the version with three numbers (1.2.0); the release version is two-part (1.2).
          VERSION="${VERSION%.0}"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore the release signing key
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build and sign the APK
        env:
          PHOTOCOMFY_ANDROID_KEYSTORE: ${{ runner.temp }}/release.keystore
          PHOTOCOMFY_ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PHOTOCOMFY_ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: apps/photocraft-android/android/build.sh out/android

      - name: Verify the signed APK
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME/build-tools"/* | sort | tail -1)"
          "$BT/apksigner" verify --print-certs out/android/PhotoComfy.apk
          badging="$("$BT/aapt2" dump badging out/android/PhotoComfy.apk)"
          echo "$badging" | grep -F "package: name='com.photocomfy.app'" \
            | grep -F "versionName='${{ steps.version.outputs.version }}'"
          echo "$badging" | grep -F "native-code: 'arm64-v8a'"
          echo "$badging" | grep -F "launchable-activity: name='com.photocomfy.app.PhotoComfyActivity'"
          unzip -l out/android/PhotoComfy.apk | grep -F 'classes.dex'

      - name: Name the release artifact
        run: cp out/android/PhotoComfy.apk "PhotoComfy-${{ steps.version.outputs.version }}-android-arm64.apk"

      - name: Upload the release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: PhotoComfy-*-android-arm64.apk
          if-no-files-found: error

  # The desktop release job skips when any platform build fails, which would leave a built APK
  # without a release. This fallback assembles an Android-only release (same shape as the shared
  # draft-release action: generated notes, checksums over every asset) so a pushed tag
  # always yields a downloadable PhotoComfy APK. When the desktop release succeeds it stays
  # skipped, and its draft already carries the APK.
  android-release:
    needs: [release, android]
    if: always() && needs.android.result == 'success' && needs.release.result != 'success'
    timeout-minutes: 10
    name: android-only release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pinned actions/download-artifact silently leaves the target directory empty here
      # (both v1.1.0 and v1.1.1 failed at the checksum step), so fetch the artifact through
      # the REST API with the run token instead — deterministic and easy to diagnose.
      - name: Fetch the Android artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p assets
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name == "release-android") | .id' | head -n 1)"
          test -n "$artifact_id"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > assets/artifact.zip
          unzip -o assets/artifact.zip -d assets
          rm assets/artifact.zip
          # Flatten: artifact zips may nest files inside a directory; bring APKs to the top.
          while IFS= read -r -d '' f; do
            cp "$f" "assets/$(basename "$f")"
          done < <(find assets -mindepth 2 -type f -name '*.apk' -print0)
          find assets -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          echo "== final assets =="
          ls -la assets

      - name: Compute checksums
        working-directory: assets
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -mindepth 1 -maxdepth 1 -type f -printf '%P\n')
          test "${#files[@]}" -gt 0
          sha256sum -- "${files[@]}" | tee SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$VERSION_OVERRIDE" ]; then
            VERSION="$VERSION_OVERRIDE"
          elif [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          fi
          test -n "$VERSION"
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --title "PhotoComfy v$VERSION" \
              --target "$GITHUB_SHA" --generate-notes
          fi
          gh release upload "v$VERSION" --clobber assets/*
