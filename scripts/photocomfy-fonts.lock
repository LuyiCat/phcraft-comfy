# PhotoComfy Chinese font pack (scripts/photocomfy-fonts.sh reads this; docs/photocomfy-fonts.md explains it).
# Fields are separated by " | "; download URLs are tried in order, separated by " ;; "; "#member" after a .zip
# URL names the file to extract from the archive.
#
#   font | family | style | file | scripts | licence | licence file | sha256 | source | download URLs
#   text | file | sha256 | download URLs
#   name | family | language | display name
#
# Fields 2-9 of a font line are its craft-fonts manifest row; the fonts are byte-identical to their sources.
# A name line gives a family its name in one language (a BCP 47 tag such as zh-Hans) for font menus whose
# interface is in that language; the manifest row gets them as a ninth field, "zh-Hans=思源黑体;zh-Hant=思源黑體".
# Only families whose own `name` table has no such record need one (docs/photocomfy-fonts.md).
# The order of the font lines is the manifest order: the UI's script fallback uses the first face of a
# script that covers a character, so the Noto families stay ahead of the display faces.

# Names for font menus in Simplified and Traditional Chinese interfaces.
